<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GatherUp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F5F2FA; --surface:#FFFFFF; --surface-2:#F2EEF8; --surface-3:#EAE4F3;
  --ink:#241E31; --ink-soft:#655E74; --ink-faint:#948CA5;
  --line:#E6E0F0; --line-soft:#EFEAF6;
  --primary:#F0563E; --primary-ink:#C93A24;
  --when:#E1900B; --where:#3D74F0; --what:#F0563E; --split:#12A46E;
  --when-bg:#FBEFD6; --where-bg:#E2ECFD; --what-bg:#FCE3DE; --split-bg:#D6F2E6;
  --good:#12A46E; --shadow:0 1px 2px rgba(36,30,49,.05),0 8px 24px rgba(36,30,49,.07);
  --shadow-lg:0 4px 12px rgba(36,30,49,.08),0 24px 60px rgba(36,30,49,.14);
  --radius:18px; --radius-sm:12px; --maxw:560px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141019; --surface:#1E1826; --surface-2:#272031; --surface-3:#31283D;
  --ink:#F3EEFA; --ink-soft:#ABA2BB; --ink-faint:#7B7289;
  --line:#33293F; --line-soft:#2A2233;
  --primary:#FF6B54; --primary-ink:#FF8B78;
  --when:#F0AE3B; --where:#6C9AFF; --what:#FF6B54; --split:#2FCB8E;
  --when-bg:#3A2E14; --where-bg:#1E2A45; --what-bg:#3A2019; --split-bg:#15342A;
  --good:#2FCB8E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 4px 12px rgba(0,0,0,.4),0 24px 60px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --bg:#141019; --surface:#1E1826; --surface-2:#272031; --surface-3:#31283D;
  --ink:#F3EEFA; --ink-soft:#ABA2BB; --ink-faint:#7B7289;
  --line:#33293F; --line-soft:#2A2233;
  --primary:#FF6B54; --primary-ink:#FF8B78;
  --when:#F0AE3B; --where:#6C9AFF; --what:#FF6B54; --split:#2FCB8E;
  --when-bg:#3A2E14; --where-bg:#1E2A45; --what-bg:#3A2019; --split-bg:#15342A;
  --good:#2FCB8E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 4px 12px rgba(0,0,0,.4),0 24px 60px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Instrument Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;padding:22px 16px 64px}
h1,h2,h3{font-family:"Bricolage Grotesque","Instrument Sans",sans-serif;margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
:focus-visible{outline:2.5px solid var(--where);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.wrap{max-width:var(--maxw);margin:0 auto}

.topbar{display:flex;align-items:center;gap:9px;margin-bottom:14px;padding:0 2px}
.logo{display:flex;align-items:center;gap:9px;font-family:"Bricolage Grotesque";font-weight:800;font-size:20px;letter-spacing:-.02em}
.logo-mark{width:30px;height:30px;border-radius:9px;flex:none;background:linear-gradient(135deg,var(--primary),var(--when));display:grid;place-items:center;color:#fff;font-size:16px;box-shadow:0 3px 8px rgba(240,86,62,.35)}
.spacer{flex:1}
.me-btn{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px 5px 5px;font-size:13px;font-weight:600;color:var(--ink);max-width:140px}
.me-btn .av{width:24px;height:24px;font-size:10px;margin:0;border:none}
.me-btn .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me-btn .cv{color:var(--ink-faint);font-size:11px}
.icon-btn{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);font-size:15px;display:grid;place-items:center;transition:.15s;flex:none}
.icon-btn:hover{color:var(--ink);border-color:var(--ink-faint)}

.livebar{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-soft);margin-bottom:14px;padding:0 4px}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--good);animation:pulse 2s infinite;flex:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(18,164,110,.45)}70%{box-shadow:0 0 0 7px rgba(18,164,110,0)}100%{box-shadow:0 0 0 0 rgba(18,164,110,0)}}
.livebar.local .live-dot{background:var(--when);animation:none}
.livebar.recon .live-dot{background:var(--ink-faint);animation:none}
.sync-chip{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--ink-faint);opacity:0;transition:.2s}
.sync-chip.show{opacity:1}

.event-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);margin-bottom:16px;position:relative;overflow:hidden}
.event-card::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:linear-gradient(var(--when),var(--where),var(--what),var(--split))}
.event-top{display:flex;align-items:flex-start;gap:12px}
.event-name{font-size:23px;font-weight:800;line-height:1.15}
.event-sub{color:var(--ink-soft);font-size:14px;margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dot{width:3px;height:3px;border-radius:50%;background:var(--ink-faint);display:inline-block}
.avatars{display:flex;margin-left:auto;flex:none}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:600;border:2px solid var(--surface);margin-left:-9px;font-family:"Bricolage Grotesque"}
.av:first-child{margin-left:0}
.av-more{background:var(--surface-3);color:var(--ink-soft)}

.stepper{display:flex;gap:7px;margin-bottom:18px}
.step{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:11px 8px 10px;text-align:center;transition:.18s;color:var(--ink-soft);display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.step:hover{border-color:var(--ink-faint)}
.step .num{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:14px;font-weight:700;background:var(--surface-2);color:var(--ink-soft);transition:.18s;font-family:"Bricolage Grotesque"}
.step .lbl{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.step.active{color:var(--ink);border-color:transparent;box-shadow:var(--shadow)}
.step.active[data-k="when"]{background:var(--when-bg)} .step.active[data-k="when"] .num{background:var(--when);color:#fff}
.step.active[data-k="where"]{background:var(--where-bg)} .step.active[data-k="where"] .num{background:var(--where);color:#fff}
.step.active[data-k="what"]{background:var(--what-bg)} .step.active[data-k="what"] .num{background:var(--what);color:#fff}
.step.active[data-k="split"]{background:var(--split-bg)} .step.active[data-k="split"] .num{background:var(--split);color:#fff}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.panel-head{padding:20px 22px 16px;border-bottom:1px solid var(--line-soft)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:7px}
.eyebrow .pip{width:8px;height:8px;border-radius:50%}
.panel-title{font-size:22px;font-weight:800;margin-top:9px;line-height:1.15}
.panel-desc{color:var(--ink-soft);font-size:14.5px;margin-top:5px}
.panel-body{padding:18px 22px 22px}
.row{display:flex;align-items:center;gap:10px}
.muted{color:var(--ink-soft)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--surface-2);color:var(--ink-soft)}
.chip.lead{background:var(--split-bg);color:var(--split)}
.tabnums{font-variant-numeric:tabular-nums}

.legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px;font-size:13px;color:var(--ink-soft)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:13px;height:13px;border-radius:4px;display:inline-block;border:1px solid var(--line)}
.grid-scroll{overflow-x:auto;margin:0 -22px;padding:0 22px}
.wgrid{display:grid;gap:6px;min-width:340px}
.wgrid .gh{font-size:12px;font-weight:600;color:var(--ink-soft);text-align:center;padding-bottom:2px}
.wgrid .gh.rowh{text-align:left;color:var(--ink-faint);font-weight:600;display:flex;align-items:center}
.slot{height:40px;border-radius:9px;background:var(--surface-2);border:1.5px solid transparent;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink-faint);transition:.12s}
.slot.mine{outline:2.5px solid var(--when);outline-offset:-2.5px;color:var(--when)}
.slot.best{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--when)}
.myrow-slot{cursor:pointer}
.myrow-slot:hover{border-color:var(--when)}
.ro .myrow-slot{cursor:default}.ro .myrow-slot:hover{border-color:transparent}
.best-banner{margin-top:16px;background:var(--when-bg);border-radius:var(--radius-sm);padding:13px 15px;display:flex;align-items:center;gap:11px;font-size:14px}
.best-ico{width:30px;height:30px;border-radius:9px;background:var(--when);color:#fff;display:grid;place-items:center;flex:none}
.empty-hint{color:var(--ink-soft);font-size:14px;text-align:center;padding:12px 0 4px}

.opt{display:flex;align-items:center;gap:13px;padding:13px 14px;border:1px solid var(--line);border-radius:var(--radius-sm);margin-bottom:9px;transition:.15s;background:var(--surface);position:relative}
.opt:hover{border-color:var(--ink-faint)}
.opt.voted{border-color:var(--where);background:var(--where-bg)}
.opt.what.voted{border-color:var(--what);background:var(--what-bg)}
.opt.leader::after{content:"Leading";position:absolute;top:-8px;right:12px;background:var(--split);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:999px;text-transform:uppercase}
.opt-emoji{width:42px;height:42px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;font-size:21px;flex:none}
.opt-main{flex:1;min-width:0}
.opt-name{font-weight:700;font-size:15.5px}
.opt-meta{font-size:13px;color:var(--ink-soft);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt-votes{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.bar{width:60px;height:6px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:999px;background:var(--where);transition:width .4s cubic-bezier(.2,.8,.2,1)}
.opt.what .bar > i{background:var(--what)}
.votebtn{border:1.5px solid var(--line);background:var(--surface);color:var(--ink-soft);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:5px;transition:.15s;white-space:nowrap}
.votebtn:hover{border-color:var(--ink)}
.opt.voted .votebtn{background:var(--where);border-color:var(--where);color:#fff}
.opt.what.voted .votebtn{background:var(--what);border-color:var(--what)}
.addrow{display:flex;gap:8px;margin-top:6px}
.addrow input{flex:1;border:1px solid var(--line);background:var(--surface-2);border-radius:11px;padding:11px 13px;font-size:14.5px;color:var(--ink)}
.addrow input::placeholder{color:var(--ink-faint)}
.btn{border:none;border-radius:11px;padding:11px 16px;font-size:14.5px;font-weight:700;background:var(--ink);color:var(--surface);transition:.15s;white-space:nowrap}
.btn:hover{opacity:.9}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.block{width:100%;justify-content:center;display:flex;align-items:center;gap:7px}

.total-card{background:var(--split-bg);border-radius:var(--radius-sm);padding:16px 18px;margin-bottom:16px}
.total-label{font-size:13px;font-weight:600;color:var(--split);text-transform:uppercase;letter-spacing:.05em}
.total-input{display:flex;align-items:baseline;gap:4px;margin-top:4px}
.total-input .cur{font-size:22px;font-weight:700;color:var(--split);font-family:"Bricolage Grotesque"}
.total-input input{border:none;background:transparent;font-family:"Bricolage Grotesque";font-weight:800;font-size:40px;color:var(--ink);width:100%;padding:0;line-height:1;font-variant-numeric:tabular-nums}
.total-input input:focus{outline:none}
.seg{display:flex;background:var(--surface-2);border-radius:11px;padding:4px;gap:4px;margin-bottom:16px}
.seg button{flex:1;border:none;background:transparent;padding:9px;border-radius:8px;font-weight:600;font-size:14px;color:var(--ink-soft);transition:.15s}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.payer-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:14px;flex-wrap:wrap}
.who-scroll{display:flex;gap:7px;overflow-x:auto;padding:2px 0 6px;margin-bottom:6px}
.who{flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);min-width:62px;transition:.15s;color:var(--ink-soft)}
.who.in{border-color:var(--split);background:var(--split-bg);color:var(--ink)}
.who .av{margin:0;border:none;width:32px;height:32px}
.who .nm{font-size:11.5px;font-weight:600;max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .amt{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.settle{margin-top:6px}
.settle-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line-soft)}
.settle-row:last-child{border:none}
.settle-info{flex:1;min-width:0}
.settle-info .nm{font-weight:600;font-size:14.5px}
.settle-info .sub{font-size:12.5px;color:var(--ink-soft)}
.settle-amt{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;font-family:"Bricolage Grotesque"}
.paynow{border:1.5px solid var(--split);color:var(--split);background:var(--split-bg);border-radius:9px;padding:6px 11px;font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:5px}
.payer-tag{color:var(--split);font-weight:700}
.itemrow{display:flex;gap:8px;align-items:center}
.itemrow input.nm{flex:1;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 11px;font-size:14px;color:var(--ink);min-width:0}
.itemrow input.pr{width:82px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 10px;font-size:14px;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.itemrow .del{width:34px;height:34px;flex:none;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink-faint);font-size:16px}
.item{border:1px solid var(--line);border-radius:13px;padding:11px 12px;margin-bottom:9px;background:var(--surface)}
.item-who{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px;align-items:center;padding-top:10px;border-top:1px dashed var(--line)}
.item-who .lbl{font-size:11.5px;color:var(--ink-faint);font-weight:600;margin-right:2px}
.iav{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:600;font-family:"Bricolage Grotesque";border:none;opacity:.3;filter:grayscale(.5);transition:.14s;cursor:pointer}
.iav.on{opacity:1;filter:none;box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--split)}
.iav:hover{opacity:.7}
.item-split{font-size:11.5px;color:var(--ink-soft);margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.scan-btn{width:100%;border:1.5px dashed var(--split);background:var(--split-bg);color:var(--split);border-radius:13px;padding:14px;font-weight:700;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:8px;transition:.15s}
.scan-btn:hover{background:var(--split);color:#fff}
.scan-note{font-size:12px;color:var(--ink-faint);margin:0 0 16px;text-align:center;line-height:1.45}

.footnav{display:flex;gap:10px;margin-top:16px}
.footnav .btn{flex:1;justify-content:center;display:flex;align-items:center;gap:7px}
.hint{text-align:center;color:var(--ink-faint);font-size:12.5px;margin-top:22px;padding:0 10px;line-height:1.55}
.ro-note{display:none;background:var(--when-bg);color:var(--ink);border-radius:12px;padding:11px 14px;font-size:13px;margin-bottom:14px;text-align:center}
.ro .ro-note{display:block}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:var(--shadow-lg);opacity:0;transition:.25s;pointer-events:none;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.fade{animation:fade .3s cubic-bezier(.2,.8,.2,1)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.overlay{position:fixed;inset:0;background:rgba(20,16,25,.55);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:80;padding:20px}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-lg);max-width:400px;width:100%;padding:26px 24px}
.sheet h2{font-size:22px;font-weight:800;margin-bottom:6px}
.sheet p{color:var(--ink-soft);font-size:14.5px;margin:0 0 18px}
.mem-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.mem-pick{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px 5px 5px;font-size:14px;font-weight:600;transition:.14s}
.mem-pick:hover{border-color:var(--ink)}
.mem-pick .av{margin:0;border:none;width:26px;height:26px;font-size:11px}
.sheet .divider{display:flex;align-items:center;gap:10px;color:var(--ink-faint);font-size:12px;margin:4px 0 14px}
.sheet .divider::before,.sheet .divider::after{content:"";flex:1;height:1px;background:var(--line)}
.join-row{display:flex;gap:8px}
.join-row input{flex:1;border:1px solid var(--line);background:var(--surface-2);border-radius:11px;padding:12px 14px;font-size:15px;color:var(--ink)}
@media(max-width:560px){body{padding:18px 12px 60px}}
</style>
</head>

<script>
(function(){
  "use strict";
  var DAYS=["Fri 29","Sat 30","Sun 31"];
  var TIMES=["12pm","3pm","6:30pm","9pm"];
  var NEWCOLORS=["#F0563E","#3D74F0","#12A46E","#E1900B","#8A5CF0","#E0559A","#2AB0C4","#7A6FF0","#0FB5A6","#F0783A"];
  var SCAN_ITEMS=[
    {name:"Signature pork broth ×2",amt:"24.00"},{name:"Wagyu beef platter",amt:"88.00"},
    {name:"Prawn paste chicken",amt:"22.00"},{name:"Assorted meatballs",amt:"34.00"},
    {name:"Veg & tofu platter",amt:"28.50"},{name:"Beer tower ×2",amt:"48.00"},
    {name:"Fresh juices ×2",amt:"32.00"},{name:"Service charge + GST",amt:"10.00"}
  ];
  function emptyState(){return {event:{name:"New Jio 🎉"},members:[],avail:{},where:[],what:[],bill:{total:"0.00",payer:"",mode:"even",present:{},items:[]}};}

  var LKEY="gatherup.local";
  var SHARED=emptyState(), local={meId:null,step:0};
  var WS=null, wsReady=false, roomId=null, applyingRemote=false, sendTimer=null, peers=1, netState="connecting";

  var $=function(s,r){return (r||document).querySelector(s);};
  function el(t,c,h){var e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;}

  function normalize(){

  /* ---------- networking ---------- */
  function roomFromUrl(){var h=(location.hash||"").replace(/^#/,"").replace(/[^a-zA-Z0-9_-]/g,"");return h||null;}
  function setNet(s){netState=s; updateLive();}
  function connect(){
    var backend=(window.GATHERUP_BACKEND||"").trim();
    if(!backend){ // offline preview mode
      var off=loadOffline(); if(off){SHARED=off;} else if(roomId==="demo"){SHARED=window.__DEMO__?window.__DEMO__():emptyState();}
      normalize(); setNet("local"); ensureIdentity(); render(); return;
    }
    try{
      WS=new WebSocket(backend);
    }catch(e){ setNet("local"); var o2=loadOffline(); if(o2)SHARED=o2; normalize(); ensureIdentity(); render(); return; }
    WS.onopen=function(){ wsReady=true; setNet("live"); WS.send(JSON.stringify({type:"join",room:roomId})); };
    WS.onmessage=function(ev){
      var msg; try{msg=JSON.parse(ev.data);}catch(e){return;}
      if(msg.type==="state"){ applyingRemote=true; SHARED=msg.state; normalize(); saveOffline(); ensureIdentity(); render(); applyingRemote=false; }
      else if(msg.type==="peers"){ peers=msg.n; updateLive(); }
    };
    WS.onclose=function(){ wsReady=false; setNet("recon"); setTimeout(connect,1600); };
    WS.onerror=function(){ try{WS.close();}catch(e){} };
  }
  function scheduleSend(){
    saveOffline();
    if(!wsReady){ return; }
    clearTimeout(sendTimer);
    sendTimer=setTimeout(function(){ try{WS.send(JSON.stringify({type:"update",room:roomId,state:SHARED}));}catch(e){} showSync("Synced ✓");},250);
  }
  function commit(){ render(); if(applyingRemote) return; showSync("Saving…"); scheduleSend(); }

  var syncTmo;
  function showSync(t){var c=$("#syncchip");if(!c)return;c.textContent=t;c.classList.add("show");clearTimeout(syncTmo);syncTmo=setTimeout(function(){c.classList.remove("show");},1400);}
  function updateLive(){
    var lb=$("#livebar"),lt=$("#liveText");if(!lb)return;
    lb.className="livebar"+(netState==="live"?"":netState==="recon"?" recon":" local");
    if(netState==="live")lt.textContent="Live · "+peers+(peers===1?" person":" people")+" on this jio";
    else if(netState==="recon")lt.textContent="Reconnecting…";
    else if(netState==="connecting")lt.textContent="Connecting…";
    else lt.textContent="Offline preview · changes stay on this device";
  }

  function bestSlot(){var best=null;DAYS.forEach(function(d){TIMES.forEach(function(t){var c=slotCount(d+"|"+t);if(!best||c>best.c)best={d:d,t:t,c:c};});});return best;}

  function panelWhen(){
    var p=$("#panel");p.className="panel fade";var best=bestSlot();var n=SHARED.members.length;var myId=local.meId,myav=SHARED.avail[myId]||{};
    var h='<div class="panel-head"><div class="eyebrow" style="color:var(--when)"><span class="pip" style="background:var(--when)"></span>Step 1 · Timing</div>'

    DAYS.forEach(function(d){h+='<div class="gh rowh">'+d+'</div>';TIMES.forEach(function(t){var slot=d+"|"+t;var c=slotCount(slot);var isMine=!!myav[slot];var isBest=(best.d===d&&best.t===t&&best.c>0);h+='<div class="slot myrow-slot'+(isMine?" mine":"")+(isBest?" best":"")+'" data-slot="'+slot+'"><span class="cnt">'+c+'</span></div>';});});

  function presentList(){return SHARED.members.filter(function(m){return SHARED.bill.present[m.id]!==false;});}
  function itemShare(it){var w=(it.who||[]).filter(function(id){return SHARED.bill.present[id]!==false;});var n=w.length||presentList().length||1;return (parseFloat(it.amt)||0)/n;}
  function computeShares(){var b=SHARED.bill;var pres=presentList();var shares={};pres.forEach(function(m){shares[m.id]=0;});var allIds=pres.map(function(m){return m.id;});
    if(b.mode==="even"){var total=parseFloat(b.total)||0;var per=total/(pres.length||1);pres.forEach(function(m){shares[m.id]=per;});return shares;}
    b.items.forEach(function(it){var amt=parseFloat(it.amt)||0;var who=(it.who||[]).filter(function(id){return SHARED.bill.present[id]!==false;});if(who.length===0)who=allIds;var each=amt/(who.length||1);who.forEach(function(id){shares[id]=(shares[id]||0)+each;});});return shares;}
  function avatarHTML(m,size){return '<span class="av" style="margin:0;border:none;width:'+size+'px;height:'+size+'px;font-size:'+(size*.4)+'px;background:'+m.color+'">'+initials(m.name)+'</span>';}

    h+='<div class="payer-row"><span class="muted">Who was there?</span><span class="muted" style="margin-left:auto">Tap to include / exclude</span></div><div class="who-scroll">';

  function wireSplit(b,pres){

  function softUpdateSplit(){
    var b=SHARED.bill;var pres=presentList();var total=b.mode==="even"?(parseFloat(b.total)||0):b.items.reduce(function(s,it){return s+(parseFloat(it.amt)||0);},0);var shares=computeShares();
    Array.prototype.forEach.call(document.querySelectorAll(".who"),function(btn){var id=btn.getAttribute("data-who");var a=btn.querySelector(".amt");if(a)a.textContent=(b.present[id]!==false)?"S$"+money(shares[id]||0):"—";});
    Array.prototype.forEach.call(document.querySelectorAll("[data-owe]"),function(s){var id=s.getAttribute("data-owe");s.textContent="S$"+money(shares[id]||0);});
    Array.prototype.forEach.call(document.querySelectorAll("[data-isp]"),function(s){var it=b.items[+s.getAttribute("data-isp")];if(it)s.textContent="S$"+money(itemShare(it))+" ea";});
    var itot=document.getElementById("itemsTotal");if(itot)itot.textContent="S$"+money(total);
    var payer=b.payer?memberById(b.payer):{id:""};var back=pres.filter(function(m){return m.id!==payer.id;}).reduce(function(s,m){return s+(Math.round((shares[m.id]||0)*100)/100);},0);
    var pb=document.getElementById("payerBack");if(pb)pb.textContent="S$"+money(back);
    var chip=document.querySelector(".chip.lead");if(chip&&b.mode==="even")chip.textContent="S$"+money(total/(pres.length||1))+" each";
  }

  function renderFoot(){var f=$("#footnav");f.innerHTML="";
    if(local.step>0){var pb=el("button","btn ghost","‹ Back");pb.onclick=function(){local.step--;saveLocal();render();};f.appendChild(pb);}
    if(local.step<STEPS.length-1){var nb=el("button","btn","Next: "+STEPS[local.step+1].lbl+" ›");nb.onclick=function(){local.step++;saveLocal();render();};f.appendChild(nb);}
    else{var db=el("button","btn","All done 🎉");db.style.background="var(--split)";db.onclick=function(){toast("Gathering sorted end-to-end! 🎊");};f.appendChild(db);}}

  function render(){
    updateLive();
    var mb=$("#meBtn");if(mb){var m=me();mb.innerHTML='<span class="av" style="background:'+m.color+'">'+initials(m.name)+'</span><span class="nm">'+esc(m.name)+'</span><span class="cv">▾</span>';}
    var en=$("#evName");if(en)en.textContent=(SHARED.event&&SHARED.event.name)||"Jio 🎉";
    var box=$("#avatars");if(box){box.innerHTML="";SHARED.members.slice(0,4).forEach(function(m){var a=el("div","av");a.style.background=m.color;a.textContent=initials(m.name);box.appendChild(a);});if(SHARED.members.length>4){var more=el("div","av av-more");more.textContent="+"+(SHARED.members.length-4);box.appendChild(more);}}
    var ec=$("#evCount");if(ec)ec.textContent=SHARED.members.length+(SHARED.members.length===1?" kaki":" kakis");
    var hint=$("#hint");if(hint)hint.innerHTML=(netState==="live")?'Live board — share this link and everyone votes together. You\'re <b>'+esc(me().name)+'</b>; tap your name to switch.':'Offline preview — set your VPS address in the code to make it live for the group.';
    renderStepper();var k=STEPS[local.step].k;
    if(k==="when")panelWhen();else if(k==="where")optionPanel("where");else if(k==="what")optionPanel("what");else panelSplit();
    renderFoot();
    var wl=SHARED.where.slice().sort(function(a,b){return b.votes.length-a.votes.length;})[0];if($("#evWhere"))$("#evWhere").textContent=wl?wl.name:"—";
    var best=bestSlot();if($("#evWhen"))$("#evWhen").textContent=(best&&best.c>0)?best.d.replace(/(\d+)/,"$1 Aug")+" · "+best.t:"—";
  }

  var tmo;function toast(msg){var t=$("#gtoast");if(!t){t=el("div","toast");t.id="gtoast";document.body.appendChild(t);}t.textContent=msg;t.classList.add("show");clearTimeout(tmo);tmo=setTimeout(function(){t.classList.remove("show");},2200);}

  /* ---------- init ---------- */
  local=readLocal();
  roomId=roomFromUrl();
  if(!roomId){ roomId=genId(); if(history&&history.replaceState)history.replaceState(null,"","#"+roomId); else location.hash=roomId; }
  skeleton();
  connect();
})();
</script>
</body>
</html>
