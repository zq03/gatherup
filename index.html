<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GatherUp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F5F2FA; --surface:#FFFFFF; --surface-2:#F2EEF8; --surface-3:#EAE4F3;
  --ink:#241E31; --ink-soft:#655E74; --ink-faint:#948CA5;
  --line:#E6E0F0; --line-soft:#EFEAF6;
  --primary:#F0563E; --primary-ink:#C93A24;
  --when:#E1900B; --where:#3D74F0; --what:#F0563E; --split:#12A46E;
  --when-bg:#FBEFD6; --where-bg:#E2ECFD; --what-bg:#FCE3DE; --split-bg:#D6F2E6;
  --good:#12A46E; --warn:#E1900B; --no:#C6416A; --star:#F5A623;
  --shadow:0 1px 2px rgba(36,30,49,.05),0 8px 24px rgba(36,30,49,.07);
  --shadow-lg:0 4px 12px rgba(36,30,49,.08),0 24px 60px rgba(36,30,49,.14);
  --radius:18px; --radius-sm:12px; --maxw:560px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141019; --surface:#1E1826; --surface-2:#272031; --surface-3:#31283D;
  --ink:#F3EEFA; --ink-soft:#ABA2BB; --ink-faint:#7B7289;
  --line:#33293F; --line-soft:#2A2233;
  --primary:#FF6B54; --primary-ink:#FF8B78;
  --when:#F0AE3B; --where:#6C9AFF; --what:#FF6B54; --split:#2FCB8E;
  --when-bg:#3A2E14; --where-bg:#1E2A45; --what-bg:#3A2019; --split-bg:#15342A;
  --good:#2FCB8E; --warn:#F0AE3B; --no:#F06A93; --star:#F5B740;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 4px 12px rgba(0,0,0,.4),0 24px 60px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --bg:#141019; --surface:#1E1826; --surface-2:#272031; --surface-3:#31283D;
  --ink:#F3EEFA; --ink-soft:#ABA2BB; --ink-faint:#7B7289;
  --line:#33293F; --line-soft:#2A2233;
  --primary:#FF6B54; --primary-ink:#FF8B78;
  --when:#F0AE3B; --where:#6C9AFF; --what:#FF6B54; --split:#2FCB8E;
  --when-bg:#3A2E14; --where-bg:#1E2A45; --what-bg:#3A2019; --split-bg:#15342A;
  --good:#2FCB8E; --warn:#F0AE3B; --no:#F06A93; --star:#F5B740;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 4px 12px rgba(0,0,0,.4),0 24px 60px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;padding:22px 16px 64px}
h1,h2,h3{font-family:"Bricolage Grotesque","Instrument Sans",sans-serif;margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
:focus-visible{outline:2.5px solid var(--where);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.wrap{max-width:var(--maxw);margin:0 auto}
.btn{border:none;border-radius:11px;padding:11px 16px;font-size:14.5px;font-weight:700;background:var(--ink);color:var(--surface);transition:.15s;white-space:nowrap}
.btn:hover{opacity:.9}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.block{width:100%;justify-content:center;display:flex;align-items:center;gap:7px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:11px;padding:12px 13px;font-size:15px;color:var(--ink)}
.field textarea{resize:vertical;min-height:52px}

/* ---- auth ---- */
.auth-card{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-lg);padding:28px 24px;margin-top:7vh}
.auth-logo{display:flex;align-items:center;gap:10px;font-family:"Bricolage Grotesque";font-weight:800;font-size:24px;margin-bottom:6px}
.logo-mark{width:34px;height:34px;border-radius:10px;flex:none;background:linear-gradient(135deg,var(--primary),var(--when));display:grid;place-items:center;color:#fff;font-size:18px;box-shadow:0 3px 8px rgba(240,86,62,.35)}
.auth-sub{color:var(--ink-soft);font-size:14.5px;margin-bottom:20px}
.auth-err{background:var(--what-bg);color:var(--what);border-radius:10px;padding:10px 12px;font-size:13.5px;margin-bottom:14px;font-weight:600}
.auth-toggle{text-align:center;margin-top:16px;font-size:13.5px;color:var(--ink-soft)}
.auth-toggle a{color:var(--where);font-weight:700;cursor:pointer}
.center-note{text-align:center;color:var(--ink-faint);font-size:13px;margin-top:24px}

/* ---- top bar ---- */
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:14px;padding:0 2px}
.logo{display:flex;align-items:center;gap:9px;font-family:"Bricolage Grotesque";font-weight:800;font-size:20px;letter-spacing:-.02em}
.logo .logo-mark{width:30px;height:30px;border-radius:9px;font-size:16px}
.spacer{flex:1}
.me-btn{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px 5px 5px;font-size:13px;font-weight:600;color:var(--ink);max-width:130px}
.me-btn .av{width:24px;height:24px;font-size:10px;margin:0;border:none}
.me-btn .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me-btn .cv{color:var(--ink-faint);font-size:11px}
.icon-btn{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);font-size:15px;display:grid;place-items:center;transition:.15s;flex:none;position:relative}
.icon-btn:hover{color:var(--ink);border-color:var(--ink-faint)}
.badge{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--primary);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg);font-family:"Bricolage Grotesque"}

/* ---- home ---- */
.home-h{font-size:26px;font-weight:800;margin:6px 2px 4px}
.home-sub{color:var(--ink-soft);font-size:14px;margin:0 2px 18px}
.jio-list{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.jio-card{display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px 17px;box-shadow:var(--shadow);cursor:pointer;transition:.15s;text-align:left;width:100%}
.jio-card:hover{border-color:var(--ink-faint)}
.jio-ic{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--when));display:grid;place-items:center;color:#fff;font-size:20px;flex:none}
.jio-card .jt{flex:1;min-width:0}
.jio-card .jt .nm{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jio-card .jt .sub{font-size:12.5px;color:var(--ink-soft)}
.jio-card .go{color:var(--ink-faint);font-size:18px}
.empty-home{text-align:center;color:var(--ink-soft);font-size:14px;padding:34px 16px;border:1px dashed var(--line);border-radius:16px;margin-bottom:16px;background:var(--surface)}

/* ---- livebar ---- */
.livebar{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-soft);margin-bottom:14px;padding:0 4px}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--good);animation:pulse 2s infinite;flex:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(18,164,110,.45)}70%{box-shadow:0 0 0 7px rgba(18,164,110,0)}100%{box-shadow:0 0 0 0 rgba(18,164,110,0)}}
.livebar.recon .live-dot{background:var(--ink-faint);animation:none}
.sync-chip{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--ink-faint);opacity:0;transition:.2s}
.sync-chip.show{opacity:1}

.event-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);margin-bottom:16px;position:relative;overflow:hidden}
.event-card::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:linear-gradient(var(--when),var(--where),var(--what),var(--split))}
.event-top{display:flex;align-items:flex-start;gap:12px}
.event-name{font-size:23px;font-weight:800;line-height:1.15;display:flex;align-items:center;gap:8px}
.ev-edit{border:none;background:transparent;color:var(--ink-faint);font-size:15px;padding:2px;border-radius:6px}
.ev-edit:hover{color:var(--ink)}
.event-note{color:var(--ink-soft);font-size:13.5px;margin-top:2px}
.event-sub{color:var(--ink-soft);font-size:14px;margin-top:5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dot{width:3px;height:3px;border-radius:50%;background:var(--ink-faint);display:inline-block}
.avatars{display:flex;margin-left:auto;flex:none}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:600;border:2px solid var(--surface);margin-left:-9px;font-family:"Bricolage Grotesque"}
.av:first-child{margin-left:0}
.av-more{background:var(--surface-3);color:var(--ink-soft)}
.countdown{margin-top:11px;display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.countdown.urgent{background:var(--what-bg);color:var(--what);border-color:transparent}
.countdown.closed{background:var(--surface-2);color:var(--ink-faint)}

.stepper{display:flex;gap:5px;margin-bottom:18px}
.step{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 4px 9px;text-align:center;transition:.18s;color:var(--ink-soft);display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;position:relative}
.step:hover{border-color:var(--ink-faint)}
.step .num{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--surface-2);color:var(--ink-soft);transition:.18s;font-family:"Bricolage Grotesque"}
.step .lbl{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.step.active{color:var(--ink);border-color:transparent;box-shadow:var(--shadow)}
.step.active[data-k="when"]{background:var(--when-bg)} .step.active[data-k="when"] .num{background:var(--when);color:#fff}
.step.active[data-k="where"]{background:var(--where-bg)} .step.active[data-k="where"] .num{background:var(--where);color:#fff}
.step.active[data-k="what"]{background:var(--what-bg)} .step.active[data-k="what"] .num{background:var(--what);color:#fff}
.step.active[data-k="plan"]{background:var(--what-bg)} .step.active[data-k="plan"] .num{background:var(--primary);color:#fff}
.step.active[data-k="arrive"]{background:var(--split-bg)} .step.active[data-k="arrive"] .num{background:var(--good);color:#fff}
.step.active[data-k="split"]{background:var(--split-bg)} .step.active[data-k="split"] .num{background:var(--split);color:#fff}
.confirm-banner{background:linear-gradient(135deg,var(--split-bg),var(--where-bg));border-radius:14px;padding:14px 16px;margin-bottom:16px;border:1px solid var(--line)}
.confirm-banner .cl{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--split);display:flex;align-items:center;gap:6px}
.confirm-banner .cx{font-size:15px;font-weight:700;margin-top:6px;line-height:1.35}
.plan-card{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px}
.plan-line{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:15px}
.plan-line:last-child{border:none}
.plan-line .pe{width:34px;height:34px;border-radius:10px;background:var(--surface);display:grid;place-items:center;font-size:17px;flex:none}
.plan-line .pv{font-weight:700}
.plan-line .pk{font-size:11.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em}
.locked-hero{text-align:center;padding:8px 0 4px}
.locked-hero .lh{font-size:26px;font-weight:800;margin-bottom:6px}
.step .sdot{position:absolute;top:6px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--good);display:none}
.step.done-all .sdot{display:block}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.panel-head{padding:20px 22px 16px;border-bottom:1px solid var(--line-soft)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:7px}
.eyebrow .pip{width:8px;height:8px;border-radius:50%}
.panel-title{font-size:22px;font-weight:800;margin-top:9px;line-height:1.15}
.panel-desc{color:var(--ink-soft);font-size:14.5px;margin-top:5px}
.panel-body{padding:18px 22px 22px}
.row{display:flex;align-items:center;gap:10px}
.muted{color:var(--ink-soft)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--surface-2);color:var(--ink-soft)}
.chip.lead{background:var(--split-bg);color:var(--split)}
.tabnums{font-variant-numeric:tabular-nums}
.progress{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:12px;padding:11px 13px;margin-bottom:15px;font-size:13px}
.pbar{flex:1;height:7px;border-radius:999px;background:var(--surface-3);overflow:hidden;min-width:40px}
.pbar > i{display:block;height:100%;border-radius:999px;background:var(--good);transition:width .4s cubic-bezier(.2,.8,.2,1)}
.pcount{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.pwaiting{color:var(--ink-soft);font-size:12px;margin-top:-6px;margin-bottom:14px;padding:0 2px}
.alldone{background:var(--split-bg);color:var(--split);border-radius:12px;padding:11px 14px;font-size:13.5px;font-weight:600;margin-bottom:15px;display:flex;align-items:center;gap:8px}

.legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px;font-size:13px;color:var(--ink-soft)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:13px;height:13px;border-radius:4px;display:inline-block;border:1px solid var(--line)}
.grid-scroll{overflow-x:auto;margin:0 -22px;padding:0 22px}
.wgrid{display:grid;gap:6px;min-width:340px}
.wgrid .gh{font-size:11.5px;font-weight:600;color:var(--ink-soft);text-align:center;padding-bottom:2px;line-height:1.1}
.wgrid .gh.rowh{text-align:left;color:var(--ink-faint);font-weight:600;display:flex;align-items:center;font-size:12px}
.slot{height:38px;border-radius:9px;background:var(--surface-2);border:1.5px solid transparent;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink-faint);transition:.12s;cursor:pointer}
.slot.mine{outline:2.5px solid var(--when);outline-offset:-2.5px;color:var(--when)}
.slot.best{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--when)}
.slot:hover{border-color:var(--when)}
.best-banner{margin-top:16px;background:var(--when-bg);border-radius:var(--radius-sm);padding:13px 15px;display:flex;align-items:center;gap:11px;font-size:14px}
.best-ico{width:30px;height:30px;border-radius:9px;background:var(--when);color:#fff;display:grid;place-items:center;flex:none}
.empty-hint{color:var(--ink-soft);font-size:14px;text-align:center;padding:12px 0 4px}

.opt{display:flex;align-items:center;gap:13px;padding:13px 14px;border:1px solid var(--line);border-radius:var(--radius-sm);margin-bottom:9px;transition:.15s;background:var(--surface);position:relative}
.opt:hover{border-color:var(--ink-faint)}
.opt.voted{border-color:var(--where);background:var(--where-bg)}
.opt.what.voted{border-color:var(--what);background:var(--what-bg)}
.opt.leader::after{content:"Leading";position:absolute;top:-8px;right:12px;background:var(--split);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:999px;text-transform:uppercase}
.opt-emoji{width:42px;height:42px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;font-size:21px;flex:none}
.opt-main{flex:1;min-width:0}
.opt-name{font-weight:700;font-size:15.5px}
.opt-meta{font-size:13px;color:var(--ink-soft);margin-top:2px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:3px;background:var(--surface-2);border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:600;color:var(--ink-soft);text-decoration:none}
.tag.price{color:var(--split)} .tag.stars{color:var(--star)}
.opt-votes{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.bar{width:56px;height:6px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:999px;background:var(--where);transition:width .4s cubic-bezier(.2,.8,.2,1)}
.opt.what .bar > i{background:var(--what)}
.votebtn{border:1.5px solid var(--line);background:var(--surface);color:var(--ink-soft);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:5px;transition:.15s;white-space:nowrap}
.votebtn:hover{border-color:var(--ink)}
.opt.voted .votebtn{background:var(--where);border-color:var(--where);color:#fff}
.opt.what.voted .votebtn{background:var(--what);border-color:var(--what)}
.quick{margin:2px 0 14px}
.quick-lbl{font-size:12px;font-weight:600;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.quick-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.quick-chip{flex:none;border:1px dashed var(--line);background:var(--surface);border-radius:11px;padding:8px 11px;font-size:12.5px;font-weight:600;text-align:left;color:var(--ink);transition:.14s;line-height:1.25}
.quick-chip:hover{border-color:var(--what);border-style:solid}
.quick-chip small{display:block;color:var(--ink-soft);font-weight:500;font-size:11px}
.addbtn{width:100%;border:1.5px dashed var(--line);background:var(--surface-2);color:var(--ink);border-radius:12px;padding:12px;font-weight:700;font-size:14px;transition:.15s}
.addbtn:hover{border-color:var(--ink-faint)}

/* arrival */
.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
.status-btn{border:1.5px solid var(--line);background:var(--surface);border-radius:13px;padding:14px 8px;font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:3px;transition:.14s;color:var(--ink)}
.status-btn small{font-weight:500;color:var(--ink-faint);font-size:11px}
.status-btn.on[data-s="here"]{border-color:var(--good);background:var(--split-bg);color:var(--good)}
.status-btn.on[data-s="otw"]{border-color:var(--where);background:var(--where-bg);color:var(--where)}
.status-btn.on[data-s="late"]{border-color:var(--warn);background:var(--when-bg);color:var(--warn)}
.status-btn.on[data-s="no"]{border-color:var(--no);background:var(--what-bg);color:var(--no)}
.eta-in{border:1px solid var(--line);background:var(--surface-2);border-radius:11px;padding:11px 13px;font-size:14.5px;color:var(--ink);width:100%;margin-bottom:16px}
.arr-summary{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.arr-row{display:flex;align-items:center;gap:11px;padding:11px 4px;border-bottom:1px solid var(--line-soft)}
.arr-row:last-child{border:none}
.arr-info{flex:1;min-width:0}
.arr-info .nm{font-weight:600;font-size:14.5px}
.arr-info .sub{font-size:12px;color:var(--ink-soft)}
.arr-badge{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.ab-here{background:var(--split-bg);color:var(--good)} .ab-otw{background:var(--where-bg);color:var(--where)}
.ab-late{background:var(--when-bg);color:var(--warn)} .ab-no{background:var(--what-bg);color:var(--no)}
.ab-none{background:var(--surface-2);color:var(--ink-faint)}

.total-card{background:var(--split-bg);border-radius:var(--radius-sm);padding:16px 18px;margin-bottom:16px}

.who.in{border-color:var(--split);background:var(--split-bg);color:var(--ink)}

.paynow{border:1.5px solid var(--split);color:var(--split);background:var(--split-bg);border-radius:9px;padding:6px 11px;font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:5px}

.iav{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:600;font-family:"Bricolage Grotesque";border:none;opacity:.3;filter:grayscale(.5);transition:.14s;cursor:pointer}

.item-split{font-size:11.5px;color:var(--ink-soft);margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.scan-btn{width:100%;border:1.5px dashed var(--split);background:var(--split-bg);color:var(--split);border-radius:13px;padding:14px;font-weight:700;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:8px;transition:.15s}
.scan-btn:hover{background:var(--split);color:#fff}

.footnav{display:flex;gap:10px;margin-top:16px}

.chips-edit{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:9px}
.dchip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 11px;font-size:12.5px;font-weight:600}
.dchip button{border:none;background:transparent;color:var(--ink-faint);font-size:15px;line-height:1;padding:0 2px;cursor:pointer}
.dchip button:hover{color:var(--what)}
.price-seg{display:flex;gap:6px}
.price-seg button{flex:1;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:8px;font-weight:700;font-size:13px;color:var(--ink-soft)}
.price-seg button.on{background:var(--split-bg);border-color:var(--split);color:var(--split)}
.star-pick{display:flex;gap:3px}
.star-pick button{border:none;background:transparent;font-size:22px;color:var(--surface-3);padding:0;line-height:1;cursor:pointer}
.star-pick button.on{color:var(--star)}
.menu-btn{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 15px;font-size:15px;font-weight:600;color:var(--ink);margin-bottom:9px;display:flex;align-items:center;gap:10px}

.act-bg{position:absolute;inset:0;background:rgba(20,16,25,.4)}

@keyframes slidein{from{transform:translateX(20px);opacity:.6}to{transform:none;opacity:1}}
.act-head{padding:18px 18px 14px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:10px}
.act-head h3{font-size:17px;font-weight:800;flex:1}
.act-list{flex:1;overflow-y:auto;padding:8px 0}
.act-item{padding:11px 18px;display:flex;gap:11px;align-items:flex-start;font-size:13.5px}
.act-item .ai-dot{width:8px;height:8px;border-radius:50%;background:var(--where);margin-top:6px;flex:none}
.act-item .ai-t{flex:1}
.act-item .ai-time{font-size:11.5px;color:var(--ink-faint);margin-top:2px}
.act-empty{padding:40px 20px;text-align:center;color:var(--ink-faint);font-size:13.5px}
.nudge-bar{padding:14px 18px;border-top:1px solid var(--line-soft)}
.hidden{display:none!important}
@media(max-width:560px){body{padding:18px 12px 60px}}
</style>

<body>

<script>
  window.GATHERUP_BACKEND = "wss://stage-mushily-ascertain.ngrok-free.dev";
</script>

<div id="root"></div>

<script>
(function(){
  "use strict";
  var TIMES=[{k:"11:00",l:"11am"},{k:"13:00",l:"1pm"},{k:"15:00",l:"3pm"},{k:"17:00",l:"5pm"},{k:"19:00",l:"7pm"},{k:"21:00",l:"9pm"}];
  var MCOLORS=["#F0563E","#3D74F0","#12A46E","#E1900B","#8A5CF0","#E0559A","#2AB0C4","#7A6FF0","#0FB5A6","#F0783A"];
  var DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var PRICE_L=["","$","$$","$$$"];
  var POPULAR=[
    {name:"Beauty in the Pot",cuisine:"Hotpot",price:2,rating:5,emoji:"🍲"},
    {name:"Din Tai Fung",cuisine:"Dumplings",price:2,rating:5,emoji:"🥟"},
    {name:"A-One Claypot",cuisine:"Zi char",price:1,rating:4,emoji:"🍜"},
    {name:"PS.Cafe",cuisine:"Western",price:3,rating:4,emoji:"🍝"},
    {name:"Swee Choon",cuisine:"Dim sum",price:1,rating:4,emoji:"🥠"}
  ];
  var SCAN_ITEMS=[
    {name:"Signature pork broth ×2",amt:"24.00"},{name:"Wagyu beef platter",amt:"88.00"},
    {name:"Prawn paste chicken",amt:"22.00"},{name:"Assorted meatballs",amt:"34.00"},
    {name:"Veg & tofu platter",amt:"28.50"},{name:"Beer tower ×2",amt:"48.00"},
    {name:"Fresh juices ×2",amt:"32.00"},{name:"Service charge + GST",amt:"10.00"}
  ];
  var STATUS={otw:{l:"On the way",e:"🚶",cls:"ab-otw"},here:{l:"Arrived",e:"✅",cls:"ab-here"},late:{l:"Running late",e:"⏰",cls:"ab-late"},no:{l:"Can't make it",e:"❌",cls:"ab-no"}};
  var STEPS=[{k:"when",num:"1",lbl:"When"},{k:"where",num:"2",lbl:"Where"},{k:"what",num:"3",lbl:"What"},{k:"plan",num:"4",lbl:"Plan"},{k:"arrive",num:"5",lbl:"Arrive"},{k:"split",num:"6",lbl:"Split"}];

  /* ---------- helpers ---------- */
  var $=function(s,r){return (r||document).querySelector(s);};
  function el(t,c,h){var e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;}
  function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
  function money(n){return n.toLocaleString("en-SG",{minimumFractionDigits:2,maximumFractionDigits:2});}
  function initials(n){return (n||"?").trim().slice(0,1).toUpperCase();}
  function revShort(n){return n>=1000?(n/1000).toFixed(1).replace(/\.0$/,"")+"k":(""+n);}
  function genId(){var s="abcdefghijkmnpqrstuvwxyz23456789",o="";for(var i=0;i<6;i++)o+=s[Math.floor(Math.random()*s.length)];return o;}
  function now(){return Date.now();}
  function validUrl(u){u=(u||"").trim();if(!u)return "";if(!/^https?:\/\//i.test(u))u="https://"+u;return u;}
  function hashCode(s){var h=0;s=""+s;for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))>>>0;}return h;}
  function colorFor(id){return MCOLORS[hashCode(id)%MCOLORS.length];}
  function pad(n){n=""+n;return n.length<2?"0"+n:n;}
  function isoOf(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
  function defaultDates(){var out=[];var d0=new Date();d0.setHours(0,0,0,0);for(var i=0;i<7;i++){out.push(isoOf(new Date(d0.getTime()+i*86400000)));}return out;}
  function fmtDate(iso){var d=new Date(iso+"T00:00:00");if(isNaN(d))return {label:iso,dow:"",dm:iso};return {dow:DOW[d.getDay()],dm:d.getDate()+" "+MON[d.getMonth()],label:DOW[d.getDay()]+" "+d.getDate()};}
  function relTime(ts){var s=Math.floor((now()-ts)/1000);if(s<60)return "just now";var m=Math.floor(s/60);if(m<60)return m+"m ago";var h=Math.floor(m/60);if(h<24)return h+"h ago";return Math.floor(h/24)+"d ago";}
  function emptyState(){return {event:{name:"New Jio 🎉",note:"",dates:defaultDates(),deadline:null},members:[],avail:{},where:[],what:[],bill:{total:"0.00",payer:"",mode:"even",present:{},items:[]},activity:[],arrival:{}};}

  /* ---------- state ---------- */
  var AKEY="gatherup.account";
  var account=null, myRooms=[], SHARED=emptyState(), step=0, roomId=null, view="loading";
  var WS=null, wsReady=false, authed=false, netState="connecting", peers=1;
  var seenActLen=0, unread=0, actOpen=false, cdTimer=null, applyingRemote=false, sendTimer=null, ensuredMember=false;
  var loginMode="login", loginErr="";

  function loadAccount(){try{var r=localStorage.getItem(AKEY);if(r)return JSON.parse(r);}catch(e){}return null;}
  function saveAccount(){try{localStorage.setItem(AKEY,JSON.stringify(account));}catch(e){}}
  function clearAccount(){try{localStorage.removeItem(AKEY);}catch(e){}}
  function meId(){return account?account.id:"";}
  function meName(){return account?account.name:"?";}
  function memberById(id){for(var i=0;i<SHARED.members.length;i++)if(SHARED.members[i].id===id)return SHARED.members[i];return {id:id,name:"?",color:"#888"};}
  function isMe(id){return id===meId();}

  function normalize(){
    SHARED=SHARED||emptyState();
    var ev=SHARED.event=SHARED.event||{};
    if(!ev.name)ev.name="New Jio 🎉"; if(ev.note==null)ev.note="";
    if(!ev.dates||!ev.dates.length)ev.dates=defaultDates(); if(ev.deadline===undefined)ev.deadline=null;
    SHARED.members=SHARED.members||[]; SHARED.avail=SHARED.avail||{}; SHARED.where=SHARED.where||[]; SHARED.what=SHARED.what||[];
    SHARED.what.forEach(function(o){if(o.cuisine==null)o.cuisine="";if(o.price==null)o.price=0;if(o.rating==null)o.rating=0;});
    SHARED.bill=SHARED.bill||{total:"0.00",payer:"",mode:"even",present:{},items:[]};
    SHARED.bill.present=SHARED.bill.present||{}; SHARED.bill.items=SHARED.bill.items||[];
    SHARED.activity=SHARED.activity||[]; SHARED.arrival=SHARED.arrival||{};
    SHARED.plan=SHARED.plan||{locked:false};
  }
  function pushActivity(text){SHARED.activity=SHARED.activity||[];SHARED.activity.push({id:genId()+now().toString(36),ts:now(),text:text});if(SHARED.activity.length>60)SHARED.activity=SHARED.activity.slice(-60);seenActLen=SHARED.activity.length;}

  /* ---------- networking + auth ---------- */
  function roomFromUrl(){var h=(location.hash||"").replace(/^#/,"").replace(/[^a-zA-Z0-9_-]/g,"");return h||null;}
  function setNet(s){netState=s;updateLive();}
  function connect(){
    var backend=(window.GATHERUP_BACKEND||"").trim();
    if(!backend){ view="login"; loginErr="This app needs its server address set in the code."; renderLogin(); return; }
    try{ WS=new WebSocket(backend); }
    catch(e){ setTimeout(connect,1600); return; }
    WS.onopen=function(){ wsReady=true; setNet("live"); if(account&&account.token){ send({type:"auth-token",token:account.token}); } else { view="login"; renderLogin(); } };
    WS.onmessage=function(ev){ var m; try{m=JSON.parse(ev.data);}catch(e){return;} onMsg(m); };
    WS.onclose=function(){ wsReady=false; authed=false; setNet("recon"); setTimeout(connect,1600); };
    WS.onerror=function(){ try{WS.close();}catch(e){} };
  }
  function send(o){ try{WS.send(JSON.stringify(o));}catch(e){} }
  function onMsg(m){
    if(m.type==="auth-ok"){
      authed=true; account={id:m.user.id,name:m.user.name,token:m.token}; saveAccount(); myRooms=m.rooms||[];
      roomId=roomFromUrl();
      if(roomId){ view="jio"; ensuredMember=false; send({type:"join",room:roomId}); renderJioShell(); }
      else { view="home"; renderHome(); }
      return;
    }
    if(m.type==="auth-err"){
      authed=false;
      if(m.reason!=="session-expired") loginErr=m.reason||"Login failed";
      else { clearAccount(); account=null; }
      view="login"; renderLogin(); return;
    }
    if(m.type==="rooms"){ myRooms=m.rooms||[]; if(view==="home")renderHome(); return; }
    if(m.type==="peers"){ peers=m.n; updateLive(); return; }
    if(m.type==="state"){ onRemoteState(m.state); return; }
  }
  function onRemoteState(state){
    applyingRemote=true;
    SHARED=state; normalize();
    var acts=SHARED.activity||[];
    if(seenActLen===0){ seenActLen=acts.length; }
    else if(acts.length>seenActLen){ var fresh=acts.slice(seenActLen); unread+=fresh.length; var last=fresh[fresh.length-1]; if(last)toast("🔔 "+last.text); seenActLen=acts.length; }
    else seenActLen=acts.length;
    ensureMember();
    applyingRemote=false;
    if(view==="jio")renderJio();
  }
  function ensureMember(){
    if(!account||ensuredMember) return;
    ensuredMember=true;
    var has=false; for(var i=0;i<SHARED.members.length;i++)if(SHARED.members[i].id===account.id){has=true;break;}
    var wasEmpty=SHARED.members.length===0;
    var pend=null; try{pend=JSON.parse(localStorage.getItem("gatherup.pending")||"null");}catch(e){}
    var applyPend=pend&&pend.id===roomId;
    if(applyPend){ if(pend.name)SHARED.event.name=pend.name; SHARED.event.note=pend.note||""; try{localStorage.removeItem("gatherup.pending");}catch(e){} }
    if(!has){ SHARED.members.push({id:account.id,name:account.name,color:colorFor(account.id)}); SHARED.bill.present[account.id]=true; pushActivity(account.name+(wasEmpty?" started the jio 🎉":" joined the jio 👋")); }
    if(!has||applyPend) scheduleSend();
  }
  function scheduleSend(){ if(!wsReady||!authed)return; clearTimeout(sendTimer); sendTimer=setTimeout(function(){ send({type:"update",room:roomId,state:SHARED}); showSync("Synced ✓"); },250); }
  function commit(){ if(view==="jio")renderJio(); if(applyingRemote)return; showSync("Saving…"); scheduleSend(); }
  var syncTmo; function showSync(t){var c=$("#syncchip");if(!c)return;c.textContent=t;c.classList.add("show");clearTimeout(syncTmo);syncTmo=setTimeout(function(){c.classList.remove("show");},1400);}
  function updateLive(){var lb=$("#livebar"),lt=$("#liveText");if(!lb)return;lb.className="livebar"+(netState==="live"?"":" recon");lt.textContent=netState==="live"?("Live · "+peers+(peers===1?" person":" people")+" on this jio"):(netState==="recon"?"Reconnecting…":"Connecting…");}

  var tmo;function toast(msg){var t=$("#gtoast");if(!t){t=el("div","toast");t.id="gtoast";document.body.appendChild(t);}t.textContent=msg;t.classList.add("show");clearTimeout(tmo);tmo=setTimeout(function(){t.classList.remove("show");},2600);}

  /* ================= LOGIN ================= */
  function renderLogin(){
    var r=$("#root");
    r.innerHTML='<div class="wrap"><div class="auth-card">'
      +'<div class="auth-logo"><span class="logo-mark">◎</span>GatherUp</div>'
      +'<div class="auth-sub">'+(loginMode==="signup"?"Create an account so your jios follow you on any device.":"Log in to see your jios.")+'</div>'
      +(loginErr?'<div class="auth-err">'+esc(loginErr)+'</div>':'')
      +(loginMode==="signup"?'<div class="field"><label>Your name</label><input id="dispName" placeholder="e.g. Ziqiang" maxlength="18"></div>':'')
      +'<div class="field"><label>Username</label><input id="uName" placeholder="a username" maxlength="24" autocapitalize="off" autocorrect="off"></div>'
      +'<div class="field"><label>PIN (4+ digits)</label><input id="uPin" type="password" inputmode="numeric" placeholder="secret PIN" maxlength="16"></div>'
      +'<button class="btn block" id="authBtn">'+(loginMode==="signup"?"Create account":"Log in")+'</button>'
      +'<div class="auth-toggle">'+(loginMode==="signup"?'Already have an account? <a id="toLogin">Log in</a>':'New here? <a id="toSignup">Create an account</a>')+'</div>'
      +'</div><p class="center-note">Your name + jios are saved to your account so you\'re remembered on any device.</p></div>';
    loginErr="";
    var go=function(){
      var u=$("#uName").value.trim(), p=$("#uPin").value.trim();
      if(!u||!p){ loginErr="Enter a username and PIN"; renderLogin(); return; }
      if(!wsReady){ loginErr="Connecting to server… try again in a moment"; renderLogin(); return; }
      var o={type:"auth",mode:loginMode,username:u,pin:p};
      if(loginMode==="signup")o.displayName=($("#dispName").value.trim()||u);
      send(o);
    };
    $("#authBtn").onclick=go;
    $("#uPin").onkeydown=function(e){if(e.key==="Enter")go();};
    var tl=$("#toLogin"); if(tl)tl.onclick=function(){loginMode="login";renderLogin();};
    var ts=$("#toSignup"); if(ts)ts.onclick=function(){loginMode="signup";renderLogin();};
    setTimeout(function(){var f=$(loginMode==="signup"?"#dispName":"#uName");if(f)f.focus();},50);
  }

  /* ================= HOME ================= */
  function renderHome(){
    var r=$("#root");
    var list = myRooms.length
      ? '<div class="jio-list">'+myRooms.slice().reverse().map(function(j){return '<button class="jio-card" data-open="'+esc(j.id)+'"><span class="jio-ic">🎉</span><span class="jt"><span class="nm">'+esc(j.name||"Jio")+'</span><span class="sub">Tap to open</span></span><span class="go">›</span></button>';}).join('')+'</div>'
      : '<div class="empty-home">No jios yet.<br>Create one, or open an invite link a friend sent you.</div>';
    r.innerHTML='<div class="wrap">'

  function participation(k){var voted=[],waiting=[];SHARED.members.forEach(function(m){var did=k==="when"?memberVotedWhen(m.id):(k==="arrive"?!!(SHARED.arrival[m.id]&&SHARED.arrival[m.id].status):memberVotedList(k==="where"?SHARED.where:SHARED.what,m.id));(did?voted:waiting).push(m);});return {voted:voted,waiting:waiting,total:SHARED.members.length};}
  function slotKeys(){var ks=[];SHARED.event.dates.forEach(function(d){TIMES.forEach(function(t){ks.push(d+"|"+t.k);});});return ks;}
  function memberVotedWhen(id){var a=SHARED.avail[id];if(!a)return false;var ks=slotKeys();for(var i=0;i<ks.length;i++)if(a[ks[i]])return true;return false;}
  function memberVotedList(list,id){for(var i=0;i<list.length;i++)if(list[i].votes.indexOf(id)>-1)return true;return false;}
  function progressHTML(k){var p=participation(k);if(p.total===0)return "";if(p.voted.length===p.total)return '<div class="alldone">✅ Everyone\'s '+(k==="arrive"?"checked in":"voted")+'!</div>';var pct=Math.round(p.voted.length/p.total*100);var h='<div class="progress"><span class="pcount">'+p.voted.length+' of '+p.total+(k==="arrive"?" checked in":" voted")+'</span><div class="pbar"><i style="width:'+pct+'%"></i></div></div>';if(p.waiting.length&&p.waiting.length<p.total)h+='<div class="pwaiting">Waiting on '+p.waiting.map(function(m){return esc(m.name);}).join(", ")+'</div>';return h;}

  /* ---- WHEN ---- */
  function slotCount(slot){var n=0;SHARED.members.forEach(function(m){if(SHARED.avail[m.id]&&SHARED.avail[m.id][slot])n++;});return n;}
  function bestSlot(){var best=null;SHARED.event.dates.forEach(function(d){TIMES.forEach(function(t){var c=slotCount(d+"|"+t.k);if(!best||c>best.c)best={d:d,t:t,c:c};});});return best;}
  function bestLabel(){var b=bestSlot();if(!b||b.c<=0)return null;var fd=fmtDate(b.d);return fd.dow+" "+fd.dm+" · "+b.t.l;}
  function panelWhen(){

    dates.forEach(function(d){var fd=fmtDate(d);h+='<div class="gh rowh">'+fd.label+'</div>';TIMES.forEach(function(t){var slot=d+"|"+t.k;var c=slotCount(slot);var mine=!!my[slot];var isBest=(best&&best.d===d&&best.t.k===t.k&&best.c>0);h+='<div class="slot'+(mine?" mine":"")+(isBest?" best":"")+'" data-slot="'+slot+'"><span>'+c+'</span></div>';});});

  function computeShares(){var b=SHARED.bill;var pres=presentList();var shares={};pres.forEach(function(m){shares[m.id]=0;});var allIds=pres.map(function(m){return m.id;});if(b.mode==="even"){var total=parseFloat(b.total)||0;var per=total/(pres.length||1);pres.forEach(function(m){shares[m.id]=per;});return shares;}b.items.forEach(function(it){var amt=parseFloat(it.amt)||0;var who=(it.who||[]).filter(function(id){return SHARED.bill.present[id]!==false;});if(who.length===0)who=allIds;var each=amt/(who.length||1);who.forEach(function(id){shares[id]=(shares[id]||0)+each;});});return shares;}

  function wireSplit(b,pres){

  function openCalendar(){var g=gcalUrl();var ov=el("div","overlay");var sheet=el("div","sheet");if(!g){sheet.innerHTML='<h2>Add to calendar 📅</h2><p>Vote on a time first (Step 1) so there\'s an event to add.</p><button class="btn block" id="cc">OK</button>';}else{sheet.innerHTML='<h2>Add to calendar 📅</h2><p>Adds the current best time.</p><button class="btn block" id="cg" style="margin-bottom:9px">📆 Google Calendar</button><button class="btn ghost block" id="ci" style="margin-bottom:9px">🍎 Apple / Outlook (.ics)</button><button class="btn ghost block" id="cc">Cancel</button>';}ov.appendChild(sheet);document.body.appendChild(ov);var cc=$("#cc");if(cc)cc.onclick=function(){ov.remove();};var cg=$("#cg");if(cg)cg.onclick=function(){window.open(g,"_blank");ov.remove();};var ci=$("#ci");if(ci)ci.onclick=function(){downloadICS();ov.remove();};}

    var hint=$("#hint");if(hint)hint.innerHTML='Share the ⇪ link — friends log in and join. You\'re <b>'+esc(meName())+'</b>.';
    var cbx=$("#confirmBox");if(cbx){var pl=SHARED.plan;if(pl&&pl.locked){var bits=[];if(pl.timeLabel)bits.push("🗓️ "+pl.timeLabel);if(pl.whereName)bits.push("📍 "+pl.whereName);if(pl.whatName)bits.push("🍽️ "+pl.whatName);cbx.innerHTML='<div class="confirm-banner"><div class="cl">📢 It\'s on!</div><div class="cx">'+esc(bits.join("  ·  ")||"Plan posted")+'</div></div>';}else cbx.innerHTML="";}
    renderStepper();var k=STEPS[step].k;
    if(k==="when")panelWhen();else if(k==="where")optionPanel("where");else if(k==="what")optionPanel("what");else if(k==="plan")panelPlan();else if(k==="arrive")panelArrive();else panelSplit();
    renderFoot();
    var wl=SHARED.where.slice().sort(function(a,b){return b.votes.length-a.votes.length;})[0];if($("#evWhere"))$("#evWhere").textContent=(wl&&wl.votes.length)?wl.name:"—";
    var bl=bestLabel();if($("#evWhen"))$("#evWhen").textContent=bl||"—";
    renderCountdown();updateBell();if(actOpen)renderActivity();
  }

  /* ---------- init ---------- */
  account=loadAccount();
  roomId=roomFromUrl();
  $("#root").innerHTML='<div class="wrap"><p class="center-note" style="margin-top:40px">Loading…</p></div>';
  connect();
  cdTimer=setInterval(function(){ if(view==="jio"){renderCountdown();autoRemind();if(actOpen)renderActivity();} },30000);
})();
</script>
</body>
